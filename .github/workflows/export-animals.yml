name: Export adoptable animals

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (GitHub may delay scheduled runs)
  workflow_dispatch:          # "Run workflow" button for an immediate refresh
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}animals.json
    steps:
      - uses: actions/checkout@v5

      - name: Export animals from Shelterluv
        env:
          SHELTERLUV_API_KEY: ${{ secrets.SHELTERLUV_API_KEY }}
          PUBLISH_STATUSES: ${{ vars.PUBLISH_STATUSES || 'Available - Public,Available - Social Only,Available - Fospice,Hold - Applications Pending,Hold - Pending Adoption' }}
          COMING_SOON_STATUSES: ${{ vars.COMING_SOON_STATUSES || 'Unavailable - Intake / Assessment' }}
          UNAVAILABLE_STATUSES: ${{ vars.UNAVAILABLE_STATUSES || 'Unavailable - Medical Recovery,Unavailable - Routine Vetting' }}
          ADOPTED_DAYS: ${{ vars.ADOPTED_DAYS || '60' }}
          SHELTER_TIMEZONE: ${{ vars.SHELTER_TIMEZONE || 'America/New_York' }}
        run: python3 scripts/export_animals.py public

      - name: Export upcoming events from our website (field guide)
        continue-on-error: true   # if the website can't be reached, publish anyway; the guide keeps its last events
        env:
          EVENTS_URL: ${{ vars.EVENTS_URL || 'https://www.redemptionrescueinc.com/events?format=json' }}
        run: python3 scripts/export_events.py public

      - name: Add the website widgets and preview page
        run: |
          cp web/* public/
          # Volunteer field guide also at the short address /fieldguide/
          mkdir -p public/fieldguide && cp web/fieldguide.html public/fieldguide/index.html

      - name: Make the field guide's home screen icons from our logo
        continue-on-error: true   # if the logo can't be downloaded, publish anyway without icons
        run: |
          pip install --quiet pillow
          python3 scripts/make_icons.py public

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - id: deploy
        uses: actions/deploy-pages@v5
