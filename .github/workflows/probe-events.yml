name: Probe events page (temporary)
on:
  push:
    branches: [claude/nice-lamport-236a0n]
    paths: [.github/workflows/probe-events.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Look for the events collection and its feeds
        shell: python3 {0}
        run: |
          import json, re, urllib.request
          UA = {"User-Agent": "Mozilla/5.0 (RR field guide probe)"}
          def get(u):
              try:
                  with urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=30) as r:
                      return r.status, r.headers.get("content-type", ""), r.read().decode("utf-8", "replace")
              except Exception as e:
                  return getattr(e, "code", "ERR"), "", str(e)
          base = "https://www.redemptionrescueinc.com"
          s, ct, body = get(base + "/sitemap.xml")
          print("sitemap", s)
          urls = re.findall(r"<loc>([^<]+)</loc>", body)
          print("pages:", len(urls))
          for u in urls:
              if re.search(r"event|calendar", u, re.I): print("  ", u)
          for path in ["/events", "/events?format=json", "/events?format=rss", "/events?format=ical"]:
              s, ct, body = get(base + path)
              print("\n==", path, s, ct, len(body))
              if "json" in ct:
                  d = json.loads(body)
                  print("keys:", list(d.keys()))
                  c = d.get("collection", {})
                  print("collection:", c.get("title"), c.get("typeName"), c.get("fullUrl"))
                  for k in ("upcoming", "past", "items"):
                      if k in d:
                          print(k, len(d[k]))
                          for it in d[k][:3]:
                              loc = it.get("location") or {}
                              print("  -", it.get("title"), "|", it.get("startDate"), it.get("endDate"), "|", loc.get("addressTitle"), loc.get("addressLine1"), loc.get("addressLine2"),
                                    "|", it.get("fullUrl"), "| img:", bool(it.get("assetUrl")), "| excerpt:", re.sub("<[^>]+>", "", it.get("excerpt") or "")[:120])
                          if d[k]: print("  fields:", sorted(d[k][0].keys()))
              else:
                  print(body[:400])
