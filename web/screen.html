<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redemption Rescue - Adoptable Pets</title>
<!--
  Full-screen digital sign for partner screens (e.g. a restaurant TV). Open it full-screen:
    https://animals.redemptionrescueinc.com/screen.html
  Works in landscape (16:9) and portrait (9:16); everything scales to the screen.
  Options in the address:  ?seconds=15  ?only=dogs|cats  ?qr=off
  Preview toolbar for checking it from a laptop (16:9 / 9:16 frame, jump to info slides): ?preview=1
  Touch screens (e.g. an iPad on our event table): swipe left/up for the next slide, right/down for the
  previous one; double-tap an animal for their full details (rotation pauses; 30s without a touch resumes it).
  Keyboard: arrow keys for next/previous, Enter for details, Esc to close.
  Tap (or click) once to go full screen, hiding the browser bars and the iPad's status bar (open it in Safari,
  not from a home-screen icon, which can't go full screen).
-->
<style>
  :root {
    --brand: rgb(221, 115, 8); /* Redemption Rescue orange: numbers, eyebrow, progress, ticker */
    --ink: #1f2326;
    --paper: #fbf7f1;        /* panel background */
    --muted: #5f646b;
    --adopted: #2e7d4f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; touch-action: manipulation; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent; }
  .serif { font-family: Georgia, "Times New Roman", serif; }

  /* The stage is the whole viewport in production, or a scaled 16:9 / 9:16 frame in ?preview=1. */
  .stage { position: absolute; top: 0; right: 0; bottom: 0; left: 0; }
  .screen { --u: 10.8px; position: absolute; top: 0; right: 0; bottom: 0; left: 0; overflow: hidden; background: var(--paper); color: var(--ink); }
  .slides { position: absolute; left: 0; right: 0; top: 0; bottom: calc(var(--u) * 6); }
  /* A new animal/slide pushes up from below and the previous one slides off the top, so a change of
     animal is unmistakable (photo changes within an animal wipe sideways instead). */
  .slides { overflow: hidden; }
  .slide { position: absolute; top: 0; right: 0; bottom: 0; left: 0;
    -webkit-transform: translateY(100%); transform: translateY(100%);
    transition: -webkit-transform .65s cubic-bezier(.76, 0, .24, 1), transform .65s cubic-bezier(.76, 0, .24, 1); }
  .slide.on { -webkit-transform: translateY(0); transform: translateY(0); }
  .slide.out { -webkit-transform: translateY(-100%); transform: translateY(-100%); }
  /* Going back (swipe right/down): the previous slide drops in from the top instead. */
  .slide.from-top { -webkit-transform: translateY(-100%); transform: translateY(-100%); }
  .slide.from-top.on { -webkit-transform: translateY(0); transform: translateY(0); }
  .slide.out-down { -webkit-transform: translateY(100%); transform: translateY(100%); }
  .slides { touch-action: none; }   /* swipes change slides instead of scrolling the page */

  /* ---- Ticker: always on screen so every glance connects the pets to the rescue ---- */
  .ticker { position: absolute; left: 0; right: 0; bottom: 0; height: calc(var(--u) * 6); background: var(--ink); color: #fff;
    display: flex; align-items: center; justify-content: center; gap: calc(var(--u) * 1.6);
    font-size: calc(var(--u) * 2.1); letter-spacing: .02em; white-space: nowrap; padding: 0 calc(var(--u) * 3); }
  .ticker b { color: var(--brand); }
  .ticker i { width: calc(var(--u) * .7); height: calc(var(--u) * .7); border-radius: 50%; background: var(--brand); display: inline-block; }
  .progress { position: absolute; left: 0; bottom: calc(var(--u) * 6); height: calc(var(--u) * .5); width: 0; background: var(--brand); z-index: 5; }
  .portrait .ticker .t-long { display: none; }

  /* ---- Animal slide: photos on one side (top in portrait), details panel on the other ---- */
  .animal { display: grid; grid-template-columns: 58% 42%; }
  .portrait .animal { grid-template-columns: 100%; grid-template-rows: 52% 48%; }
  .photos { position: relative; overflow: hidden; background: #2b2f33; }
  /* Photos don't move; each new one wipes in from the right over the previous one. */
  .photos > img { position: absolute; top: 0; right: 0; bottom: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0;
    -webkit-clip-path: inset(0 0 0 100%); clip-path: inset(0 0 0 100%);
    transition: -webkit-clip-path 1s cubic-bezier(.65, 0, .35, 1), clip-path 1s cubic-bezier(.65, 0, .35, 1); }
  .photos > img.on { z-index: 2; -webkit-clip-path: inset(0); clip-path: inset(0); }
  .photos > img.was { z-index: 1; -webkit-clip-path: inset(0); clip-path: inset(0); transition: none; }
  .photos > img.instant { transition: none; }
  /* Story-style progress bars: one per photo, the current one fills as it plays. */
  .photo-bars { position: absolute; z-index: 3; top: calc(var(--u) * 2.2); left: calc(var(--u) * 2.2); right: calc(var(--u) * 2.2);
    display: flex; gap: calc(var(--u) * .8); }
  .photo-bars span { flex: 1; height: calc(var(--u) * .55); border-radius: calc(var(--u) * .5); overflow: hidden;
    background: rgba(255,255,255,.35); box-shadow: 0 0 calc(var(--u) * .4) rgba(0,0,0,.25); }
  .photo-bars i { display: block; height: 100%; width: 0; background: #fff; }

  .panel { display: flex; flex-direction: column; justify-content: center; padding: calc(var(--u) * 5) calc(var(--u) * 5.5); min-width: 0; min-height: 0; overflow: hidden; }
  .panel > * { flex-shrink: 0; }   /* never squash the name or bio line to nothing; fitSlide() scales down instead */
  .portrait .panel { padding: calc(var(--u) * 4) calc(var(--u) * 6) calc(var(--u) * 3); }
  .logo { height: calc(var(--u) * 14); width: auto; align-self: flex-start; margin-bottom: calc(var(--u) * 3); }
  .portrait .logo { height: calc(var(--u) * 11); margin-bottom: calc(var(--u) * 2); }
  .eyebrow { font-size: calc(var(--u) * 1.9); font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--brand); }
  /* line-height + bottom padding leave room for descenders (g, j, p, q, y) inside the clipped box. */
  .name { margin: calc(var(--u) * .4) 0 calc(var(--u) * .4); padding-bottom: .12em; font-size: calc(var(--u) * 9.5); line-height: 1.12;
    font-weight: 700; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta { font-size: calc(var(--u) * 2.9); color: var(--muted); }
  .line { margin-top: calc(var(--u) * 2.2); font-size: calc(var(--u) * 2.8); line-height: 1.35;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .portrait .line { -webkit-line-clamp: 2; }
  .facts { display: flex; align-items: center; gap: calc(var(--u) * 3.5); margin-top: calc(var(--u) * 4); }
  .portrait .facts { justify-content: space-between; }
  .wait { flex: none; }
  .wait b { display: block; font-size: calc(var(--u) * 8); line-height: .95; color: var(--brand); font-weight: 800; }
  .wait span { display: block; font-size: calc(var(--u) * 2.2); color: var(--muted); line-height: 1.25; margin-top: calc(var(--u) * .5); }
  /* QR "ticket": the code on white with an orange action band underneath. */
  .qr-card { flex: none; display: flex; flex-direction: column; width: calc(var(--u) * 21); overflow: hidden;
    border-radius: calc(var(--u) * 1.8); background: #fff; box-shadow: 0 calc(var(--u) * .4) calc(var(--u) * 2.4) rgba(0,0,0,.12); }
  .qr { padding: calc(var(--u) * 1.5) calc(var(--u) * 1.5) calc(var(--u) * 1.1); }
  .qr svg { width: calc(var(--u) * 18); height: calc(var(--u) * 18); display: block; }
  .qr-cta { display: flex; align-items: center; justify-content: center; gap: calc(var(--u) * .8);
    padding: calc(var(--u) * 1.1) calc(var(--u) * 1.2); background: var(--brand); color: #fff;
    font-weight: 800; font-size: calc(var(--u) * 2.4); line-height: 1.15; text-align: center; }
  .qr-cta svg { flex: none; width: calc(var(--u) * 2.5); height: calc(var(--u) * 2.5); fill: none; stroke: currentColor; stroke-width: 2.2;
    stroke-linecap: round; stroke-linejoin: round; }
  .portrait .qr-card { width: calc(var(--u) * 24); }
  .portrait .qr svg { width: calc(var(--u) * 21); height: calc(var(--u) * 21); }
  .portrait .qr-cta { font-size: calc(var(--u) * 2.8); }
  .qr-card.big { width: calc(var(--u) * 25); }
  .qr-card.big .qr svg { width: calc(var(--u) * 22); height: calc(var(--u) * 22); }
  .qr-card.big .qr-cta { font-size: calc(var(--u) * 2.7); }
  .portrait .qr-card.big { width: calc(var(--u) * 31); }
  .portrait .qr-card.big .qr svg { width: calc(var(--u) * 28); height: calc(var(--u) * 28); }
  .portrait .qr-card.big .qr-cta { font-size: calc(var(--u) * 3.4); }
  .no-qr .qr-card { display: none; }

  /* Portrait tablets (e.g. iPad, about 3:4) are much less tall than a 9:16 screen: more room for the
     details panel, a smaller logo and QR. Anything that still doesn't fit is scaled down by fitSlide(). */
  .squat .animal { grid-template-rows: 46% 54%; }
  .squat .panel { padding: calc(var(--u) * 3.2) calc(var(--u) * 6) calc(var(--u) * 2.6); }
  .squat .logo { height: calc(var(--u) * 8.5); margin-bottom: calc(var(--u) * 1.6); }
  .squat .name { font-size: calc(var(--u) * 8.5); }
  .squat .line { margin-top: calc(var(--u) * 1.6); }
  /* The QR "ticket" moves beside the text (it's a wide screen for portrait), freeing height for the name and bio. */
  .squat .panel { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: calc(var(--u) * 4); align-content: center; }
  .squat .panel > * { grid-column: 1; }
  .squat .logo { justify-self: start; }
  .squat .line { -webkit-line-clamp: 3; }
  .squat .facts { display: contents; }
  .squat .wait { grid-column: 1; margin-top: calc(var(--u) * 2.8); }
  .squat .wait b { font-size: calc(var(--u) * 7.5); }
  .squat .qr-card { grid-column: 2; grid-row: 1 / span 6; align-self: center; width: calc(var(--u) * 23); }
  .squat .qr svg { width: calc(var(--u) * 20); height: calc(var(--u) * 20); }
  .squat .qr-cta { font-size: calc(var(--u) * 2.6); }
  .squat .detail { grid-template-rows: 42% 58%; }

  /* ---- Info slides: who we are / how to adopt / happy tails ---- */
  .info { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    padding: calc(var(--u) * 5) calc(var(--u) * 8); }
  .info .logo { align-self: center; height: calc(var(--u) * 20); margin-bottom: calc(var(--u) * 3); }
  .info h2 { margin: 0 0 calc(var(--u) * 2); font-size: calc(var(--u) * 6.5); font-weight: 400; line-height: 1.1; }
  .info p.lede { margin: 0 auto; max-width: calc(var(--u) * 120); font-size: calc(var(--u) * 3.2); line-height: 1.4; color: var(--muted); }
  .bigstats { display: flex; justify-content: center; gap: calc(var(--u) * 8); margin-top: calc(var(--u) * 5); }
  .portrait .bigstats { flex-direction: column; gap: calc(var(--u) * 4); }
  .bigstats b { display: block; font-size: calc(var(--u) * 11); line-height: 1; color: var(--brand); font-weight: 800; }
  .bigstats span { display: block; font-size: calc(var(--u) * 2.6); color: var(--muted); margin-top: calc(var(--u) * .8); }
  .steps { display: flex; gap: calc(var(--u) * 4); margin: calc(var(--u) * 4) 0; text-align: left; }
  .portrait .steps { flex-direction: column; gap: calc(var(--u) * 3); }
  .step { flex: 1; display: flex; gap: calc(var(--u) * 2); align-items: flex-start; max-width: calc(var(--u) * 46); }
  .step i { flex: none; width: calc(var(--u) * 7); height: calc(var(--u) * 7); border-radius: 50%; background: var(--brand); color: #fff;
    font-style: normal; font-weight: 800; font-size: calc(var(--u) * 3.6); display: flex; align-items: center; justify-content: center; }
  .step b { display: block; font-size: calc(var(--u) * 3.2); margin-top: calc(var(--u) * .4); }
  .step span { display: block; font-size: calc(var(--u) * 2.3); color: var(--muted); margin-top: calc(var(--u) * .6); line-height: 1.35; }
  .info .qr-card { margin-top: calc(var(--u) * 1); }
  .info .logo.small { height: calc(var(--u) * 12); margin-bottom: calc(var(--u) * 2.5); }
  .portrait .info .logo.small { height: calc(var(--u) * 17); }
  /* Happy tails: words + QR beside the photo grid in landscape, stacked in portrait. */
  .tails-wrap { display: grid; grid-template-columns: 40% 1fr; grid-template-areas: "copy grid" "qr grid";
    column-gap: calc(var(--u) * 6); align-items: center; width: 100%; text-align: left; }
  .tails-copy { grid-area: copy; align-self: end; }
  .tails-copy .logo { align-self: flex-start; display: block; }
  .tails-wrap .qr-card { grid-area: qr; align-self: start; margin-top: calc(var(--u) * 3); }
  .tails-wrap .tails { grid-area: grid; }
  .portrait .tails-wrap { grid-template-columns: 100%; grid-template-areas: "copy" "grid" "qr"; text-align: center; justify-items: center; }
  .portrait .tails-copy .logo { margin-left: auto; margin-right: auto; }
  /* Portrait screens have room to spare vertically, so the info slides get larger type. */
  .portrait .info h2 { font-size: calc(var(--u) * 8.5); }
  .portrait .info p.lede { font-size: calc(var(--u) * 3.8); }
  .portrait .step { max-width: none; }
  .portrait .step i { width: calc(var(--u) * 9); height: calc(var(--u) * 9); font-size: calc(var(--u) * 4.6); }
  .portrait .step b { font-size: calc(var(--u) * 4.6); }
  .portrait .step span { font-size: calc(var(--u) * 3.3); }
  .portrait .info .logo { height: calc(var(--u) * 26); }
  .portrait .bigstats b { font-size: calc(var(--u) * 15); }
  .portrait .bigstats span { font-size: calc(var(--u) * 3.4); }
  .tails { display: grid; grid-template-columns: repeat(3, 1fr); gap: calc(var(--u) * 1.6); width: 100%; }
  .portrait .tails { margin: calc(var(--u) * 4) 0 calc(var(--u) * 2); }
  .tail { position: relative; aspect-ratio: 1 / 1; border-radius: calc(var(--u) * 1.6); overflow: hidden; background: #ddd; }
  .tail img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tail em { position: absolute; top: calc(var(--u) * 2.2); right: calc(var(--u) * -4.2); width: calc(var(--u) * 17); transform: rotate(45deg);
    background: var(--adopted); color: #fff; font-style: normal; font-weight: 700; font-size: calc(var(--u) * 1.4); letter-spacing: .08em;
    text-transform: uppercase; text-align: center; padding: calc(var(--u) * .5) 0; }
  .tail span { position: absolute; left: 0; right: 0; bottom: 0; padding: calc(var(--u) * 3) calc(var(--u) * 1.4) calc(var(--u) * 1.2);
    color: #fff; font-weight: 700; font-size: calc(var(--u) * 2.2); text-align: left; background: linear-gradient(transparent, rgba(0,0,0,.65)); }

  /* ---- Animal details (double-tap an animal): paused, hands-on view for talking with visitors ---- */
  .detail-wrap { position: absolute; left: 0; right: 0; top: 0; bottom: calc(var(--u) * 6); z-index: 20; display: none;
    background: rgba(20, 22, 24, .55); padding: calc(var(--u) * 2.5); cursor: auto; touch-action: manipulation; }
  .detail-wrap.open { display: block; -webkit-animation: dfade .25s ease; animation: dfade .25s ease; }
  @-webkit-keyframes dfade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes dfade { from { opacity: 0; } to { opacity: 1; } }
  .detail { position: relative; height: 100%; display: grid; grid-template-columns: 55% 45%; overflow: hidden;
    border-radius: calc(var(--u) * 2); background: var(--paper); box-shadow: 0 calc(var(--u) * 1) calc(var(--u) * 5) rgba(0,0,0,.35); }
  .portrait .detail { grid-template-columns: 100%; grid-template-rows: 44% 56%; }
  .d-close { position: absolute; z-index: 3; top: calc(var(--u) * 1.6); right: calc(var(--u) * 1.6); width: calc(var(--u) * 6.5); height: calc(var(--u) * 6.5);
    border: none; border-radius: 50%; background: rgba(255,255,255,.95); color: var(--ink); font-size: calc(var(--u) * 4.4); line-height: 1;
    box-shadow: 0 calc(var(--u) * .3) calc(var(--u) * 1.2) rgba(0,0,0,.25); cursor: pointer; }
  .d-gallery { position: relative; min-height: 0; background: #1d2023; }
  .d-track { position: absolute; top: 0; right: 0; bottom: 0; left: 0; display: flex; overflow-x: auto; overflow-y: hidden;
    -webkit-overflow-scrolling: touch; scroll-snap-type: x mandatory; scrollbar-width: none; touch-action: pan-x; }
  .d-track::-webkit-scrollbar { display: none; }
  .d-track img { flex: 0 0 100%; width: 100%; height: 100%; object-fit: contain; scroll-snap-align: center; }
  .d-nav { position: absolute; top: 50%; z-index: 2; width: calc(var(--u) * 6.5); height: calc(var(--u) * 6.5); margin-top: calc(var(--u) * -3.25);
    border: none; border-radius: 50%; background: rgba(255,255,255,.9); color: var(--ink); font-size: calc(var(--u) * 4.5); line-height: 1; cursor: pointer; }
  .d-prev { left: calc(var(--u) * 1.6); } .d-next { right: calc(var(--u) * 1.6); }
  .d-nav[hidden] { display: none; }
  .d-dots { position: absolute; z-index: 2; left: 0; right: 0; bottom: calc(var(--u) * 1.8); display: flex; justify-content: center; gap: calc(var(--u) * .9); }
  .d-dots i { width: calc(var(--u) * 1.1); height: calc(var(--u) * 1.1); border-radius: 50%; background: rgba(255,255,255,.45); }
  .d-dots i.on { background: #fff; }
  .d-info { min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y;
    padding: calc(var(--u) * 4) calc(var(--u) * 4.5) calc(var(--u) * 4); }
  .portrait .d-info { padding: calc(var(--u) * 3.5) calc(var(--u) * 5); }
  .d-info .eyebrow { font-size: calc(var(--u) * 1.6); }
  .d-name { margin: calc(var(--u) * .4) 0 0; padding-right: calc(var(--u) * 7); font-size: calc(var(--u) * 6.2); line-height: 1.12; font-weight: 700; }
  .d-meta { margin-top: calc(var(--u) * .6); font-size: calc(var(--u) * 2.3); color: var(--muted); }
  .d-top { display: flex; align-items: flex-start; gap: calc(var(--u) * 3); margin-top: calc(var(--u) * 2.6); }
  .d-top .qr-card { width: calc(var(--u) * 19); }
  .d-top .qr svg { width: calc(var(--u) * 16); height: calc(var(--u) * 16); }
  .d-top .qr-cta { font-size: calc(var(--u) * 1.9); }
  .d-fee { flex: 1; min-width: 0; }
  .d-fee b { display: block; font-size: calc(var(--u) * 5.4); line-height: 1; color: var(--brand); font-weight: 800; }
  .d-fee span { display: block; margin-top: calc(var(--u) * .6); font-size: calc(var(--u) * 1.9); color: var(--muted); }
  .d-fee .d-wait { margin-top: calc(var(--u) * 2.4); }
  .d-h { margin: calc(var(--u) * 3.2) 0 calc(var(--u) * 1.2); font-size: calc(var(--u) * 1.6); font-weight: 700; letter-spacing: .14em;
    text-transform: uppercase; color: var(--brand); }
  .d-facts { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; margin: 0; overflow: hidden; border-radius: calc(var(--u) * 1.2);
    background: #e6dfd4; border: 1px solid #e6dfd4; }
  .d-facts div { padding: calc(var(--u) * 1.1) calc(var(--u) * 1.5); background: #fff; }
  .d-facts div:last-child:nth-child(odd) { grid-column: 1 / -1; }
  .d-facts dt { font-size: calc(var(--u) * 1.4); color: var(--muted); }
  .d-facts dd { margin: calc(var(--u) * .2) 0 0; font-size: calc(var(--u) * 2); font-weight: 700; }
  .d-tags { display: flex; flex-wrap: wrap; gap: calc(var(--u) * .8); margin-top: calc(var(--u) * 1.6); }
  .d-tags span { padding: calc(var(--u) * .5) calc(var(--u) * 1.3); border-radius: 999px; background: rgba(221,115,8,.12); color: #8a4600;
    font-size: calc(var(--u) * 1.6); font-weight: 600; }
  .d-bio p { margin: 0 0 calc(var(--u) * 1.4); font-size: calc(var(--u) * 2.05); line-height: 1.55; }

  /* ---- Preview toolbar (?preview=1 only) ---- */
  .previewbar { display: none; }
  body.preview { background: #2a2a2a; cursor: auto; }
  body.preview .previewbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; position: fixed; top: 0; left: 0; right: 0; z-index: 50;
    padding: 10px 14px; background: #151515; color: #ddd; font-size: 13px; }
  .previewbar span { opacity: .6; margin: 0 4px 0 10px; }
  .previewbar button { font: inherit; padding: 6px 12px; border-radius: 999px; border: 1px solid #555; background: transparent; color: #fff; cursor: pointer; }
  .previewbar button[aria-pressed="true"] { background: #fff; color: #111; }
  body.preview .stage { top: 60px; bottom: 16px; left: 16px; right: 16px; }
  body.preview .screen { box-shadow: 0 10px 40px rgba(0,0,0,.6); }
</style>
</head>
<body>
  <div class="previewbar">
    <strong>Screen preview</strong>
    <span>Screen</span><button data-orient="landscape" aria-pressed="true">16:9 landscape</button><button data-orient="portrait">9:16 portrait</button>
    <span>Jump to</span><button data-jump="animal">Next animal</button><button data-jump="who">Who we are</button><button data-jump="how">How to adopt</button><button data-jump="tails">Happy tails</button>
  </div>
  <div class="stage"><div class="screen">
    <div class="slides"></div>
    <div class="progress"></div>
    <div class="detail-wrap" role="dialog" aria-modal="true" aria-label="Animal details"></div>

    else if (e.key === "Enter") openCurrent();
  });

  // ---- preview controls ----
  document.querySelectorAll(".previewbar button").forEach(function (b) {
    b.addEventListener("click", function () {
      var o = b.getAttribute("data-orient"), j = b.getAttribute("data-jump");
      if (o) {
        orient = o;
        document.querySelectorAll("[data-orient]").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); });
        fit();
      }
      if (j === "animal") { var a = queue.filter(function (q) { return q.kind === "animal"; })[0]; if (!a) buildQueue(); next(); }
      else if (j && !detailOpen) go({ kind: j });
    });
  });

  // ---- full screen: the first touch/click hides the browser bars and the iPad status bar ----
  // (Browsers only allow this from a tap. Not available in home-screen web apps, which keep the status bar.)
  function goFullscreen() {
    var d = document, el = d.documentElement;
    if (preview || d.fullscreenElement || d.webkitFullscreenElement) return;
    var req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (!req || !(d.fullscreenEnabled || d.webkitFullscreenEnabled)) return;
    try { var r = req.call(el); if (r && r.catch) r.catch(function () {}); } catch (e) {}
  }
  document.addEventListener("touchend", goFullscreen);
  document.addEventListener("click", goFullscreen);
  // Keep the screen sized correctly when entering/leaving full screen.
  document.addEventListener("fullscreenchange", fit);
  document.addEventListener("webkitfullscreenchange", fit);

  // ---- run ----
  fit();
  refresh().then(function () { buildQueue(); next(); });
  setInterval(refresh, REFRESH_MS);
  // Reload once a night (around 4am) so long-running TV browsers stay fresh.
  var loadedAt = Date.now();
  setInterval(function () {
    if (!preview && !detailOpen && new Date().getHours() === 4 && Date.now() - loadedAt > 3 * 3600000) location.reload();
  }, 10 * 60000);
})();
</script>
</body>
</html>
