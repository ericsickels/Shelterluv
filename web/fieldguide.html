<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf7f2">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-title" content="RR Field Guide">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="application-name" content="RR Field Guide">
<link rel="apple-touch-icon" href="/fieldguide-icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="/fieldguide-icon-192.png">
<link rel="manifest" href="/fieldguide.webmanifest">
<title>Volunteer Field Guide - Redemption Rescue</title>
<!--
  Volunteer field guide for events: every animal in our care, with a QR code volunteers can show
  attendees for available animals, plus a tab of general QR codes (donate, adopt, foster, social).
  Open on a phone: https://animals.redemptionrescueinc.com/fieldguide
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf7f2; --card: #fff; --line: #e8e2d9; --text: #2a2622; --muted: #7a726a; --text-2: #4a443e;
    --brand: rgb(221, 115, 8); --brand-ink: #a85500; --brand-soft: rgba(221, 115, 8, .1);
    --pending: #9a5b00; --pending-bg: #fdf0d9; --soon: #1f66b3; --soon-bg: #e6f0fb; --unavail: #6b6b73; --unavail-bg: #efeeec;
    --shadow: 0 1px 2px rgba(60,40,20,.06), 0 4px 14px rgba(60,40,20,.06);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif; }
  body { padding-bottom: calc(76px + var(--safe-b)); }
  button { font: inherit; color: inherit; }
  .cond { font-family: Oswald, "Arial Narrow", sans-serif; font-weight: 500; text-transform: uppercase; letter-spacing: .03em; }

  /* ---- Header ---- */
  .top { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 12px; padding: 10px 16px;
    background: rgba(255,255,255,.92); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .top img { width: 46px; height: 46px; object-fit: contain; flex: none; }
  .top .eyebrow { color: var(--brand-ink); font-size: 12px; letter-spacing: .14em; }
  .top h1 { margin: 2px 0 0; font-size: 22px; line-height: 1; white-space: nowrap; }
  .top .updated { margin-left: auto; text-align: right; font-size: 12px; line-height: 1.35; color: var(--muted); }

  main { padding: 14px 16px 24px; max-width: 760px; margin: 0 auto; }
  .tab { display: none; } .tab.on { display: block; }

  /* ---- Search + filters ---- */
  .tools { display: flex; gap: 8px; margin-bottom: 6px; }
  .search { flex: 1; min-width: 0; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--card);
    color: var(--text); font-size: 16px; }
  .search:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  .chips { display: flex; gap: 8px; margin: 10px 0 4px; }
  .chips button { padding: 7px 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--text-2); font-size: 14px; font-weight: 600; }
  .chips button[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: #fff; }

  /* ---- Sections + cards ---- */
  .section h2 { display: flex; align-items: baseline; gap: 10px; margin: 22px 0 4px; font-size: 21px; }
  .section h2 small { font-family: -apple-system, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 400; color: var(--muted); letter-spacing: 0; text-transform: none; }
  .section .hint { margin: 0 0 12px; color: var(--muted); font-size: 13px; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  @media (min-width: 620px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  .card { display: block; width: 100%; padding: 0; text-align: left; border: none; border-radius: 14px; overflow: hidden;
    background: var(--card); box-shadow: var(--shadow); cursor: pointer; }
  .card .ph { position: relative; aspect-ratio: 4 / 3; background: #efe9e1; }
  .card .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card .body { padding: 10px 12px 12px; }
  .card h3 { margin: 0; font-size: 20px; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .meta { margin-top: 3px; font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .qr-flag { position: absolute; right: 8px; bottom: 8px; width: 30px; height: 30px; border-radius: 8px; background: rgba(255,255,255,.92);
    display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 3px rgba(0,0,0,.15); }
  .card .qr-flag svg { width: 18px; height: 18px; fill: none; stroke: var(--text); stroke-width: 2; }
  .muted-photo img { filter: grayscale(1); opacity: .75; }
  .pill { display: inline-block; margin-top: 8px; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; letter-spacing: .02em; }
  .pill.pending { background: var(--pending-bg); color: var(--pending); }
  .pill.soon { background: var(--soon-bg); color: var(--soon); }
  .pill.unavail { background: var(--unavail-bg); color: var(--unavail); }
  .pill.tag { background: var(--brand-soft); color: var(--brand-ink); }
  .none { padding: 18px; border: 1px dashed var(--line); border-radius: 14px; color: var(--muted); text-align: center; font-size: 14px; }

  /* ---- QR codes tab ---- */
  .directions { display: flex; gap: 14px; align-items: flex-start; padding: 16px; border-radius: 16px; margin-bottom: 16px; background: var(--card); box-shadow: var(--shadow); }
  .directions h2 { margin: 0 0 6px; font-size: 19px; }
  .directions p { margin: 0; line-height: 1.5; color: var(--text-2); }
  .links { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .lnk { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 64px; padding: 14px; border-radius: 16px;
    border: 1.5px solid var(--brand); background: var(--card); color: var(--brand-ink); font-size: 17px; font-weight: 600; text-align: center; cursor: pointer; }
  .lnk.primary { grid-column: 1 / -1; min-height: 76px; background: var(--brand); color: #fff; font-size: 20px; font-weight: 700; }
  .lnk.fb { border: none; background: #1877f2; color: #fff; }
  .lnk.ig { border: none; background: linear-gradient(45deg, #5b51d8, #c13584 55%, #f77737); color: #fff; }
  .lnk svg { width: 24px; height: 24px; flex: none; }
  .lnk[disabled] { opacity: .45; cursor: default; }
  .lnk small { display: block; font-size: 12px; font-weight: 500; opacity: .8; }

  /* ---- Bottom tab bar ---- */
  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: center; gap: 8px;
    padding: 8px 16px calc(8px + var(--safe-b)); background: rgba(255,255,255,.96); border-top: 1px solid var(--line); }
  .tabbar button { flex: 1; max-width: 220px; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; border: none;
    background: transparent; color: var(--muted); font-size: 13px; font-weight: 600; position: relative; cursor: pointer; }
  .tabbar button svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .tabbar button[aria-selected="true"] { color: var(--brand-ink); }
  .tabbar button[aria-selected="true"]::before { content: ""; position: absolute; top: -9px; left: 30%; right: 30%; height: 3px; border-radius: 3px; background: var(--brand); }

  /* ---- Animal detail sheet ---- */
  .sheet { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 30; background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch;
    transform: translateY(100%); transition: transform .3s cubic-bezier(.2,.8,.2,1); visibility: hidden; }
  .sheet.open { transform: none; visibility: visible; }
  .sheet-close { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); left: 12px; z-index: 2; width: 44px; height: 44px; border-radius: 50%; border: none;
    background: rgba(255,255,255,.92); color: var(--text); font-size: 26px; line-height: 1; cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,.2); }
  .gallery { position: relative; }
  .track { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
  .track::-webkit-scrollbar { display: none; }
  .track img, .track .noimg { flex: 0 0 100%; width: 100%; aspect-ratio: 1 / 1; object-fit: cover; scroll-snap-align: center; background: #efe9e1; }
  .count { position: absolute; right: 12px; bottom: 12px; padding: 3px 10px; border-radius: 999px; background: rgba(0,0,0,.5); color: #fff; font-size: 13px; }
  .detail { padding: 16px 16px 120px; max-width: 760px; margin: 0 auto; }
  .detail h2 { margin: 0; font-size: 36px; line-height: 1.1; }
  .detail .sub { margin-top: 6px; color: var(--muted); font-size: 16px; }
  .foster { display: flex; align-items: center; gap: 10px; margin: 14px 0 0; padding: 10px 14px; border-radius: 12px; background: var(--brand-soft); color: var(--text-2); font-size: 15px; }
  .foster svg { width: 22px; height: 22px; flex: none; fill: none; stroke: var(--brand-ink); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .foster b { color: var(--text); }
  .note { margin: 16px 0 0; padding: 12px 14px; border-radius: 12px; line-height: 1.45; font-size: 15px; color: var(--text-2); }
  .note b { display: block; margin-bottom: 2px; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
  .note.pending { background: var(--pending-bg); border-left: 4px solid #e0a030; }
  .note.pending b { color: var(--pending); }
  .note.soon { background: var(--soon-bg); border-left: 4px solid #6aa5e0; }
  .note.soon b { color: var(--soon); }
  .note.unavail { background: var(--unavail-bg); border-left: 4px solid #b5b3b0; }
  .note.unavail b { color: var(--unavail); }
  .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; margin: 18px 0 0; border-radius: 12px; overflow: hidden; background: var(--line); box-shadow: var(--shadow); }
  .facts div { padding: 10px 12px; background: var(--card); }
  .facts div:last-child:nth-child(odd) { grid-column: 1 / -1; }
  .facts dt { font-size: 12px; color: var(--muted); }
  .facts dd { margin: 2px 0 0; font-weight: 600; font-size: 16px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .about h3 { margin: 22px 0 8px; font-size: 18px; color: var(--brand-ink); }
  .about p { margin: 0 0 12px; line-height: 1.6; color: var(--text-2); }
  .cta { position: fixed; left: 0; right: 0; bottom: 0; z-index: 2; padding: 12px 16px calc(12px + var(--safe-b));
    background: linear-gradient(rgba(250,247,242,0), var(--bg) 30%); }
  .cta button { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; max-width: 728px; margin: 0 auto; min-height: 58px;
    border: none; border-radius: 16px; background: var(--brand); color: #fff; font-size: 19px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 14px rgba(221,115,8,.3); }
  .cta svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2.2; }

  /* ---- Full-screen QR (white for easy scanning) ---- */
  .qr-view { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 40; display: none; flex-direction: column; align-items: center; justify-content: center;
    padding: calc(20px + env(safe-area-inset-top, 0px)) 24px calc(20px + var(--safe-b)); background: #fff; color: #111; text-align: center; }
  .qr-view.open { display: flex; }
  .qr-view .close { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); right: 12px; width: 48px; height: 48px; border-radius: 50%;
    border: none; background: #f0ece6; color: #111; font-size: 28px; line-height: 1; cursor: pointer; }
  .qr-view .brand { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-bottom: 14px; }
  .qr-view .brand img { height: min(17vw, 9vh, 84px); width: auto; }
  .qr-view .brand span { font-family: Oswald, "Arial Narrow", sans-serif; font-weight: 600; text-transform: uppercase; letter-spacing: .08em;
    font-size: min(5.6vw, 24px); color: #2a2622; }
  .qr-view .label { font-family: Oswald, "Arial Narrow", sans-serif; font-weight: 500; text-transform: uppercase; font-size: min(8vw, 34px); line-height: 1.1;
    margin-bottom: 4px; color: var(--brand-ink); }
  .qr-view .sublabel { color: #666; font-size: 16px; margin-bottom: 14px; }
  .qr-view .code { width: min(80vw, 52vh, 420px); height: min(80vw, 52vh, 420px); }
  .qr-view .code svg { width: 100%; height: 100%; display: block; }
  .qr-view .url { margin-top: 12px; font-size: min(3.7vw, 15px); color: #555; word-break: break-all; }

  /* ---- Today banner + Events tab ---- */
  .today:empty { display: none; }
  .today-card { display: flex; align-items: center; gap: 12px; width: 100%; margin: 0 0 14px; padding: 12px 14px; border: none; border-radius: 14px;
    background: var(--brand); color: #fff; text-align: left; cursor: pointer; box-shadow: 0 4px 14px rgba(221,115,8,.25); }
  .today-card .when { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; opacity: .92; }
  .today-card .title { margin: 2px 0; font-size: 20px; line-height: 1.15; }
  .today-card .where { font-size: 14px; opacity: .92; }
  .today-card .go { margin-left: auto; font-size: 28px; line-height: 1; opacity: .9; }
  .ev { margin-bottom: 16px; border-radius: 16px; overflow: hidden; background: var(--card); box-shadow: var(--shadow); transition: box-shadow .3s; }
  .ev.flash { box-shadow: 0 0 0 3px var(--brand), var(--shadow); }
  .ev .img { aspect-ratio: 16 / 9; background: #efe9e1; }
  .ev .img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ev .body { display: flex; gap: 14px; padding: 14px; }
  .ev .date { flex: none; align-self: flex-start; width: 58px; padding: 6px 0 7px; border-radius: 12px; background: var(--brand-soft); color: var(--brand-ink); text-align: center; }
  .ev .date .m { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
  .ev .date .d { font-family: Oswald, "Arial Narrow", sans-serif; font-weight: 500; font-size: 28px; line-height: 1.05; color: var(--text); }
  .ev .date .w { font-size: 12px; }
  .ev .info { min-width: 0; }
  .ev h3 { margin: 0 0 4px; font-size: 20px; line-height: 1.15; }
  .ev .line { margin-top: 2px; font-size: 14px; color: var(--text-2); }
  .ev .line b { font-weight: 600; }
  .ev .pill { margin: 0 0 6px; }
  .ev .excerpt { margin: 8px 0 0; font-size: 14px; line-height: 1.5; color: var(--muted);
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .ev .actions { display: flex; gap: 10px; padding: 0 14px 14px; }
  .ev .actions a { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; border-radius: 12px;
    border: 1.5px solid var(--brand); color: var(--brand-ink); font-size: 15px; font-weight: 600; text-decoration: none; }
  .ev .actions a.primary { background: var(--brand); color: #fff; }
  .ev .actions svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* ---- Volunteer briefing tab (briefings.json; shown from a week before an event until midnight that day) ---- */
  .tabbar button .dot { position: absolute; top: 2px; right: calc(50% - 20px); width: 9px; height: 9px; border-radius: 50%; background: var(--brand); box-shadow: 0 0 0 2px #fff; }
  .tabbar button[hidden] { display: none; }
  .bf { margin-bottom: 26px; }
  .bf-hero { padding: 18px 16px 16px; border-radius: 16px; background: var(--brand); color: #fff; box-shadow: 0 4px 14px rgba(221,115,8,.25); }
  .bf-eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; opacity: .9; }
  .bf-hero h2 { margin: 4px 0 4px; font-size: 28px; line-height: 1.1; }
  .bf-hero p { margin: 0; font-size: 15px; line-height: 1.45; opacity: .95; }
  .bf-hero .where { margin-top: 8px; font-size: 14px; opacity: .92; }
  .bf-count { margin-top: 12px; padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,.18); font-size: 16px; font-weight: 700; }
  .bf-count small { display: block; font-size: 13px; font-weight: 500; opacity: .9; }
  .bf-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .bf-actions a, .bf-actions button { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 8px; border-radius: 12px;
    border: 1.5px solid var(--brand); background: var(--card); color: var(--brand-ink); font-size: 15px; font-weight: 600; text-decoration: none; cursor: pointer; }
  .bf-actions .primary { background: var(--brand); color: #fff; }
  .bf-actions .chat { grid-column: 1 / -1; border: none; background: linear-gradient(90deg, #0a7cff, #a033ff); color: #fff; }
  .bf-actions svg { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .bf-sec { margin-top: 14px; padding: 14px 16px; border-radius: 16px; background: var(--card); box-shadow: var(--shadow); }
  .bf-sec h3 { margin: 0 0 10px; font-size: 18px; color: var(--brand-ink); }
  .bf-sec p, .bf-sec li { font-size: 15px; line-height: 1.5; color: var(--text-2); }
  .bf-sec b { color: var(--text); }
  .bf-sec ul, .bf-sec ol { margin: 0; padding-left: 22px; }
  .bf-sec li + li { margin-top: 8px; }
  .bf-sec ol li::marker { color: var(--brand-ink); font-weight: 700; }
  .bf-note { margin: 10px 0 0; font-size: 14px; color: var(--muted); }
  .bf-shifts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .bf-shifts div { padding: 10px 12px; border-radius: 12px; background: var(--brand-soft); }
  .bf-shifts b { display: block; font-size: 15px; color: var(--brand-ink); }
  .bf-shifts span { font-size: 16px; font-weight: 600; color: var(--text); }
  .bf-shifts .now { box-shadow: 0 0 0 2px var(--brand); }
  /* Who's volunteering: one row per person, a bar for the time they're working */
  .bf-shifts .sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .bf-shifts small { display: block; margin-top: 2px; font-size: 13px; color: var(--muted); }
  .bf-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 10px 0 12px; font-size: 13px; color: var(--muted); }
  .bf-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .bf-legend i { width: 18px; height: 10px; border-radius: 3px; display: inline-block; }
  .bf-gantt { --name: 46%; }
  .bf-axis, .bf-row { display: grid; grid-template-columns: var(--name) 1fr; align-items: center; }
  .bf-axis { margin-bottom: 4px; font-size: 11px; font-weight: 600; color: var(--muted); }
  .bf-axis .track, .bf-row .track { position: relative; height: 100%; }
  .bf-axis .track { height: 16px; }
  .bf-axis .track span { position: absolute; top: 0; transform: translateX(-50%); white-space: nowrap; }
  .bf-axis .track span:first-child { transform: none; }
  .bf-axis .track span:last-child { transform: translateX(-100%); }
  .bf-rows { position: relative; }
  .bf-row { min-height: 30px; border-top: 1px solid #f1ece5; }
  .bf-row:nth-child(even) { background: #fcfaf6; }
  .bf-row .nm { padding: 5px 8px 5px 2px; font-size: 15px; line-height: 1.2; color: var(--text-2); }
  .bf-row .nm b { color: var(--text); font-weight: 600; }
  .bf-row .track { height: 30px; }
  .bf-bar { position: absolute; top: 8px; bottom: 8px; border-radius: 4px; }
  .bf-grid { position: absolute; top: 0; bottom: 0; right: 0; left: var(--name); pointer-events: none; }
  .bf-grid i { position: absolute; top: 0; bottom: 0; border-left: 1px dashed #e3dbcf; }
  .bf-grid .nowline { border-left: 2px solid #d33; }
  .bf-count-line { margin: 10px 0 0; font-size: 13px; color: var(--muted); }
  .bf-info-link { display: inline-flex; align-items: center; margin: 6px 0 0; padding: 5px 12px; border: 1.5px solid var(--brand); border-radius: 999px;
    background: var(--card); color: var(--brand-ink); font-size: 14px; font-weight: 600; cursor: pointer; }
  li .bf-info-link, small .bf-info-link { display: flex; width: max-content; }
  .info-sheet { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 44; display: none; background: rgba(30,26,22,.45); }
  .info-sheet.open { display: flex; align-items: flex-end; }
  .info-sheet .panel { position: relative; width: 100%; max-width: 760px; margin: 0 auto; max-height: 88vh; display: flex; flex-direction: column;
    border-radius: 18px 18px 0 0; background: var(--bg); box-shadow: 0 -6px 24px rgba(0,0,0,.2); }
  .info-sheet .close { position: absolute; top: 10px; right: 10px; z-index: 2; width: 44px; height: 44px; border-radius: 50%; border: none;
    background: #fff; color: var(--text); font-size: 26px; line-height: 1; box-shadow: 0 1px 4px rgba(0,0,0,.15); cursor: pointer; }
  .info-sheet .body { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 18px 16px calc(24px + var(--safe-b)); }
  .info-sheet h2 { margin: 2px 56px 4px 2px; font-size: 26px; color: var(--brand-ink); }
  .install-sheet { z-index: 46; }

  .install-sheet .hero b { display: block; font-size: 18px; }
  .install-sheet .hero span { font-size: 14px; color: var(--muted); }

  .install-sheet ol li { margin-bottom: 10px; font-size: 16px; line-height: 1.45; color: var(--text-2); }
  .install-sheet .ico { display: inline-flex; vertical-align: -5px; width: 24px; height: 24px; align-items: center; justify-content: center; border-radius: 6px;
    background: #fff; border: 1px solid var(--line); margin: 0 2px; }
  .install-sheet .ico svg { width: 16px; height: 16px; fill: none; stroke: #1a73e8; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .install-sheet .big { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 54px; margin: 6px 0 10px; border: none; border-radius: 14px;
    background: var(--brand); color: #fff; font-size: 18px; font-weight: 700; cursor: pointer; }
  .install-sheet .alt { display: block; width: 100%; min-height: 46px; border: 1.5px solid var(--brand); border-radius: 12px; background: var(--card);
    color: var(--brand-ink); font-size: 16px; font-weight: 600; cursor: pointer; }
  .install-sheet .tip { margin: 12px 0 0; font-size: 14px; color: var(--muted); }
  .bf-time { list-style: none; padding: 0 !important; }
  .bf-time li { display: flex; gap: 12px; padding: 8px 10px; margin: 0 !important; border-radius: 10px; }
  .bf-time .t { flex: none; width: 74px; font-weight: 700; color: var(--text); }
  .bf-time .past { opacity: .45; }
  .bf-time .next { background: var(--brand-soft); }
  .bf-time .next .t { color: var(--brand-ink); }

  .bf-pass { display: flex; gap: 14px; align-items: center; }

  .bf-pass .btns { display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .bf-pass .btns button, .bf-pass .btns a { min-height: 42px; border-radius: 10px; border: 1.5px solid var(--brand); background: var(--card); color: var(--brand-ink);
    font-size: 15px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .bf-pass .btns .primary { background: var(--brand); color: #fff; }
  .bf-checks { display: flex; flex-direction: column; gap: 8px; }
  .bf-check { display: flex; align-items: flex-start; gap: 12px; width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px;
    background: var(--card); text-align: left; font-size: 15px; line-height: 1.4; color: var(--text-2); cursor: pointer; }
  .bf-check i { flex: none; width: 22px; height: 22px; margin-top: 1px; border-radius: 6px; border: 2px solid #c9c1b6; display: flex; align-items: center; justify-content: center; }
  .bf-check.on { background: var(--brand-soft); border-color: transparent; }
  .bf-check.on i { background: var(--brand); border-color: var(--brand); }
  .bf-check.on i::after { content: ""; width: 6px; height: 11px; margin-top: -2px; border: solid #fff; border-width: 0 2.5px 2.5px 0; transform: rotate(45deg); }
  .bf-check.on span { text-decoration: line-through; color: var(--muted); }
  .bf-checks-done { margin: 8px 0 0; font-size: 14px; font-weight: 600; color: var(--brand-ink); }
  .today-card.brief { background: #2a2622; box-shadow: 0 4px 14px rgba(0,0,0,.18); }
  .today-card.brief .when { color: #ffb366; opacity: 1; }
  /* Milestone countdown: a small bar above the tab bar for the 15 minutes before each scheduled time */
  .bf-alert { position: fixed; left: 0; right: 0; bottom: calc(66px + var(--safe-b)); z-index: 19; display: none; justify-content: center; padding: 0 12px 8px; pointer-events: none; }
  .bf-alert.on { display: flex; }
  .bf-alert button { pointer-events: auto; display: flex; align-items: center; gap: 10px; width: 100%; max-width: 560px; padding: 10px 14px; border: none; border-radius: 14px;
    background: #2a2622; color: #fff; font-size: 15px; font-weight: 600; text-align: left; box-shadow: 0 6px 18px rgba(0,0,0,.25); cursor: pointer; }
  .bf-alert .clock { margin-left: auto; padding: 3px 10px; border-radius: 999px; background: var(--brand); font-variant-numeric: tabular-nums; font-weight: 700; }
  .bf-alert .ic { font-size: 18px; line-height: 1; }
  body.has-alert { padding-bottom: calc(130px + var(--safe-b)); }
  /* Parking pass, full screen */
  .pass-view { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 45; display: none; flex-direction: column; background: #fff; }
  .pass-view.open { display: flex; }
  .pass-view .close { position: absolute; z-index: 2; top: calc(12px + env(safe-area-inset-top, 0px)); right: 12px; width: 48px; height: 48px; border-radius: 50%;
    border: none; background: #f0ece6; color: #111; font-size: 28px; line-height: 1; cursor: pointer; }
  .pass-view .img { flex: 1; min-height: 0; overflow: auto; -webkit-overflow-scrolling: touch; display: flex; align-items: center; justify-content: center;
    padding: calc(16px + env(safe-area-inset-top, 0px)) 12px 12px; }
  .pass-view .img img { max-width: 100%; max-height: 100%; }
  .pass-view .bar { display: flex; gap: 10px; padding: 10px 16px calc(12px + var(--safe-b)); border-top: 1px solid var(--line); }
  .pass-view .bar button, .pass-view .bar a { flex: 1; min-height: 48px; border-radius: 12px; border: 1.5px solid var(--brand); background: #fff; color: var(--brand-ink);
    font-size: 16px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .pass-view .bar .primary { background: var(--brand); color: #fff; }
  /* Printing the parking pass prints only the pass. */
  #print-pass { display: none; }
  @media print {
    @page { margin: 0.4in; }
    html.printing-pass body { padding: 0 !important; background: #fff !important; }
    html.printing-pass body > :not(#print-pass) { display: none !important; }
    html.printing-pass #print-pass { display: block !important; }
    #print-pass img { display: block; width: 100%; max-height: 9.6in; object-fit: contain; }
  }

  .loading { padding: 40px 0; text-align: center; color: var(--muted); }
</style>

<body>

<script src="/qrcode.js"></script>
<script>
(function () {
  // ---- Configuration -------------------------------------------------------
  // Where an animal's QR code goes: their page on our site, which has the Apply button.
  var ANIMAL_URL = "https://redemptionrescueinc.com/adopt#animal-{id}";
  // General QR codes on the "QR codes" tab. Leave a url empty ("") to show the button as "Link needed".
  var LINKS = [
    { key: "donate", label: "Donate", qrLabel: "Donate to Redemption Rescue", url: "https://redemptionrescueinc.com/donate", style: "primary" },
    { key: "adopt", label: "Adoption application", qrLabel: "Adopt", url: "https://redemptionrescueinc.com/adopt" },
    { key: "foster", label: "Foster application", qrLabel: "Foster", url: "https://redemptionrescueinc.com/foster" },
    { key: "facebook", label: "Follow on Facebook", qrLabel: "Follow us on Facebook", url: "https://www.facebook.com/redemptionforthem", style: "fb" },
    { key: "instagram", label: "Follow on Instagram", qrLabel: "Follow us on Instagram", url: "https://www.instagram.com/redemptionrescue", style: "ig" }
  ];
  var PENDING_STATUSES = ["Hold - Applications Pending", "Hold - Pending Adoption"];
  var TIMEZONE = "America/New_York";   // event dates and "today" are shown in this time zone
  var REFRESH_MS = 10 * 60000;
  // --------------------------------------------------------------------------

  var EMBEDDED = null; /*EMBEDDED_DATA*/
  var STATUS_TEXT = {
    "Hold - Applications Pending": "Applications pending",
    "Hold - Pending Adoption": "Adoption pending",
    "Unavailable - Intake / Assessment": "Available soon",
    "Unavailable - Medical Recovery": "Medical recovery",
    "Unavailable - Routine Vetting": "Routine vetting",
    "Available - Fospice": "Fospice"
  };
  var ICON_QR = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v1M14 20h1M18 18h3v3"/></svg>';
  var ICON_FB = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#fff"/><path fill="#1877f2" d="M13.4 20v-6.3h2.1l.3-2.5h-2.4V9.7c0-.7.2-1.2 1.2-1.2h1.3V6.3a17 17 0 0 0-1.9-.1c-1.9 0-3.2 1.2-3.2 3.3v1.8H8.7v2.5h2.1V20z"/></svg>';
  var ICON_IG = '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="#fff"/></svg>';

  var $ = function (s, r) { return (r || document).querySelector(s); };
  var data = { available: [], soon: [], unavailable: [], events: [], fosters: {}, briefings: [], updated: null };
  var filterType = "All", query = "";

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function age(m) {
    if (m == null || m === "") return "";
    var y = Math.floor(m / 12), r = m % 12;
    if (!y) return r + (r === 1 ? " month" : " months");
    return y + (y === 1 ? " year" : " years") + (r ? ", " + r + " mo" : "");
  }
  function days(a) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(a.intakeDate || "");
    return m ? Math.max(0, Math.floor((Date.now() - Date.UTC(+m[1], +m[2] - 1, +m[3])) / 86400000)) : null;
  }
  function isPending(a) { return PENDING_STATUSES.indexOf(a.status) >= 0; }
  function hasQr(a) { return a.group === "available"; }   // available + pending only
  function qrSvg(url) {
    var q = qrcode(0, "M"); q.addData(url); q.make();
    var n = q.getModuleCount(), pad = 3, d = "";
    for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) if (q.isDark(r, c)) d += "M" + (c + pad) + "," + (r + pad) + "h1v1h-1z";
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + (n + pad * 2) + " " + (n + pad * 2) + '" shape-rendering="crispEdges">' +
      '<rect width="100%" height="100%" fill="#fff"/><path d="' + d + '" fill="#000"/></svg>';
  }
  function foster(a) { return data.fosters[String(a.id)] || ""; }
  function animalUrl(a) { return ANIMAL_URL.replace("{id}", encodeURIComponent(a.id)); }
  function byName(x, y) { return x.name.localeCompare(y.name); }
  function all() { return data.available.concat(data.soon, data.unavailable); }
  function find(id) { return all().filter(function (a) { return String(a.id) === String(id); })[0]; }

  // ---- data (cached on the phone so the guide still works on weak event Wi-Fi) ----
  function getJSON(name) {
    return fetch("/" + name + "?v=" + Math.floor(Date.now() / 300000)).then(function (r) { if (!r.ok) throw 0; return r.json(); });
  }
  function apply(raw) {
    function tag(list, group) { return (list || []).map(function (a) { a.group = group; a.photos = a.photos || []; return a; }); }
    data.available = tag(raw.available, "available").sort(function (x, y) { return (isPending(x) - isPending(y)) || byName(x, y); });
    data.soon = tag(raw.soon, "soon").sort(byName);
    data.unavailable = tag(raw.unavailable, "unavailable").sort(byName);
    data.updated = raw.updated;
    data.fosters = raw.fosters || {};
    data.briefings = raw.briefings || [];
    data.events = (raw.events || []).slice().sort(function (x, y) { return x.start - y.start; });
    renderAnimals();
    renderEvents();   // also renders the briefing tab
    showUpdated(raw.offline);
  }
  function load() {
    return Promise.all([getJSON("animals.json"), getJSON("coming-soon.json"), getJSON("unavailable.json").catch(function () { return { animals: [] }; }),
        getJSON("events.json").catch(function () { return null; }), getJSON("fosters.json").catch(function () { return null; }),
        getJSON("briefings.json").catch(function () { return null; })])
      .then(function (r) {
        var raw = { available: r[0].animals, soon: r[1].animals, unavailable: r[2].animals, updated: r[0].updated || new Date().toISOString(),
          events: r[3] ? r[3].events : data.events, fosters: r[4] ? r[4].fosters : data.fosters,
          briefings: r[5] ? r[5].briefings : data.briefings };
        try { localStorage.setItem("slv-fieldguide", JSON.stringify(raw)); } catch (e) {}
        apply(raw);
      })
      .catch(function () {
        var cached = null;
        try { cached = JSON.parse(localStorage.getItem("slv-fieldguide")); } catch (e) {}
        if (!cached && EMBEDDED) cached = EMBEDDED;
        if (cached) { cached.offline = true; apply(cached); }
        else $(".sections").innerHTML = '<p class="none">Couldn\u2019t load the animals. Check your connection and pull down to refresh.</p>';
      });
  }
  function showUpdated(offline) {
    var t = data.updated ? new Date(data.updated) : null, mins = t ? Math.round((Date.now() - t) / 60000) : null;
    $(".updated").innerHTML = (mins === null ? (offline ? "Offline" : "") : mins < 2 ? "Updated<br>just now" : (offline ? "Offline<br>" : "Updated<br>") + (mins < 90 ? mins + " min" : Math.round(mins / 60) + " hr") + " ago");
  }

  // ---- animal list ----
  function card(a) {
    var pill = a.group === "available"
      ? (STATUS_TEXT[a.status] ? '<span class="pill ' + (isPending(a) ? "pending" : "tag") + '">' + esc(STATUS_TEXT[a.status]) + "</span>" : "")
      : '<span class="pill ' + (a.group === "soon" ? "soon" : "unavail") + '">' + esc(STATUS_TEXT[a.status] || a.status.replace(/^Unavailable - /, "")) + "</span>";
    return '<button type="button" class="card" data-id="' + esc(a.id) + '">' +
      '<div class="ph' + (a.group === "unavailable" ? " muted-photo" : "") + '">' +
        (a.photos[0] ? '<img loading="lazy" src="' + esc(a.photos[0]) + '" alt="">' : "") +
        (hasQr(a) ? '<span class="qr-flag" title="Has a QR code">' + ICON_QR + "</span>" : "") +
      "</div>" +
      '<div class="body"><h3 class="cond">' + esc(a.name) + "</h3>" +
        '<div class="meta">' + esc([a.sex, age(a.ageMonths)].filter(Boolean).join(" \u00b7 ")) + "</div>" +
        '<div class="meta">' + esc(a.breed || "") + "</div>" + pill +
      "</div></button>";
  }
  function section(title, hint, list) {
    var shown = list.filter(function (a) {
      if (filterType !== "All" && a.type !== filterType) return false;
      if (!query) return true;
      return (a.name + " " + (a.breed || "") + " " + (foster(a) || "")).toLowerCase().indexOf(query) >= 0;
    });
    return '<div class="section"><h2 class="cond">' + esc(title) + " <small>" + shown.length + "</small></h2>" +
      (hint ? '<p class="hint">' + esc(hint) + "</p>" : "") +
      (shown.length ? '<div class="grid">' + shown.map(card).join("") + "</div>" : '<p class="none">' + (query || filterType !== "All" ? "No matches" : "None right now") + "</p>") +
      "</div>";
  }
  function renderAnimals() {
    $(".sections").innerHTML =
      section("Available", "Tap an animal to show their QR code. Pending pets can still get applications.", data.available) +
      section("Available soon", "Settling in and finishing intake. No applications yet.", data.soon) +
      section("Currently unavailable", "In medical recovery or routine vetting. Not available for adoption right now.", data.unavailable);
  }

  // ---- animal detail ----
  function facts(a) {
    var d = days(a), fixed = a.altered === "Yes" ? "Yes" : a.altered === "No" ? "Not yet" : "";
    return [
      ["Age", age(a.ageMonths)], ["Sex", a.sex], ["Breed", a.breed], ["Color", [a.color, a.pattern].filter(Boolean).join(", ")],
      ["Size", a.size], ["Weight", a.weightLbs ? a.weightLbs + " lbs" : ""],
      [a.sex === "Female" ? "Spayed" : a.sex === "Male" ? "Neutered" : "Spayed / neutered", fixed],
      ["With us", d === null ? "" : d === 0 ? "Arrived today" : d + (d === 1 ? " day" : " days")],
      ["Adoption fee", a.group === "available" && a.adoptionFee ? "$" + a.adoptionFee : ""]
    ].filter(function (f) { return f[1]; });
  }
  var openId = null;
  function openAnimal(id, push) {
    var a = find(id);
    if (!a) return;
    if (!push && openId === String(a.id) && $(".sheet").classList.contains("open")) return;   // back from its QR code
    openId = String(a.id);

      (b.shifts.length > 1 ? '<div class="bf-legend"><span><i style="background:' + CREW_BOTH + '"></i>Working both shifts</span></div>' : "") +
      '<div class="bf-gantt"><div class="bf-axis"><span></span><div class="track">' + ticks.map(function (t) {
        return '<span style="left:' + pct(mins(t)) + '">' + esc(hm12(t).replace(" PM", "").replace(" AM", "")) + "</span>";
      }).join("") + "</div></div>" +
      '<div class="bf-rows"><div class="bf-grid">' + ticks.map(function (t) { return '<i style="left:' + pct(mins(t)) + '"></i>'; }).join("") +
        (nowM >= lo && nowM <= hi ? '<i class="nowline" style="left:' + pct(nowM) + '"></i>' : "") + "</div>" +
      people.map(function (p) {
        var ii = p.shifts.map(idx).filter(function (i) { return i >= 0; });
        if (!ii.length) return "";
        var s0 = Math.min.apply(null, ii.map(function (i) { return mins(b.shifts[i].start); }));
        var s1 = Math.max.apply(null, ii.map(function (i) { return mins(b.shifts[i].end); }));
        var bg = ii.length > 1 ? CREW_BOTH : CREW_COLORS[ii[0] % 2];
        return '<div class="bf-row"><div class="nm"><b>' + esc(p.last) + "</b>, " + esc(p.first) + '</div><div class="track">' +
          '<span class="bf-bar" style="left:' + pct(s0) + ";width:calc(" + pct(s1) + " - " + pct(s0) + ");background:" + bg + '"></span></div></div>';
      }).join("") + "</div></div>" +
      '<p class="bf-count-line">' + people.length + " volunteers, sorted by last name" + (nowM >= lo && nowM <= hi ? " &middot; red line = now" : "") + "</p></section>";
  }
  function secHtml(b, sec, si, done) {
    var html = '<section class="bf-sec">' + (sec.title ? '<h3 class="cond">' + esc(sec.title) + "</h3>" : "");
    if (sec.text) html += "<p>" + bold(sec.text) + "</p>";
    if (sec.steps) html += "<ol>" + sec.steps.map(function (x) { return "<li>" + bold(x) + "</li>"; }).join("") + "</ol>";
    if (sec.items) html += "<ul>" + sec.items.map(function (x) { return "<li>" + bold(x) + "</li>"; }).join("") + "</ul>";
    if (sec.checklist) {
      var n = 0;
      html += '<div class="bf-checks">' + sec.checklist.map(function (x, i) {
        var key = si + "." + i, on = done.indexOf(key) >= 0; if (on) n++;
        return '<button type="button" class="bf-check' + (on ? " on" : "") + '" data-b="' + esc(b.id) + '" data-k="' + key + '" aria-pressed="' + on + '"><i></i><span>' + bold(x) + "</span></button>";
      }).join("") + "</div>" + (n === sec.checklist.length ? '<p class="bf-checks-done">All set. See you there!</p>' : "");
    }
    return html + "</section>";
  }
  // Pop-up explainers (briefing "info" entries), opened from [[id|link text]] in any briefing text.
  function findInfo(id) {
    var bs = activeBriefings();
    for (var i = 0; i < bs.length; i++) for (var j = 0; j < (bs[i].info || []).length; j++) if (bs[i].info[j].id === id) return { b: bs[i], info: bs[i].info[j] };
    return null;
  }
  function openInfo(id, push) {
    var f = findInfo(id); if (!f) return;
    $(".info-sheet .body").innerHTML = '<h2 class="cond">' + esc(f.info.title) + "</h2>" +
      (f.info.sections || []).map(function (sec, i) { return secHtml(f.b, sec, i, []); }).join("");
    $(".info-sheet .body").scrollTop = 0;
    $(".info-sheet").classList.add("open");
    if (push) history.pushState({ v: "info", id: id }, "", location.hash);
  }
  function closeInfo() { $(".info-sheet").classList.remove("open"); }
  // The next scheduled milestone within 15 minutes (or one that just happened), for the countdown bar.
  var ALERT_BEFORE = 15 * 60000, ALERT_AFTER = 60000;
  function updateAlert() {
    var now = Date.now(), hit = null;
    activeBriefings().filter(isBriefDay).forEach(function (b) {
      (b.timeline || []).forEach(function (t) {
        if (!t.time) return;
        var at = tzMs(b.date, t.time), d = at - now;
        if (d <= ALERT_BEFORE && d > -ALERT_AFTER && (!hit || at < hit.at)) hit = { at: at, label: t.label, d: d };
      });
    });
    var el = $(".bf-alert");
    el.classList.toggle("on", !!hit);
    document.body.classList.toggle("has-alert", !!hit);
    if (!hit) return;
    var label = hit.label.replace(/^Call time: /, "");
    label = label.charAt(0).toUpperCase() + label.slice(1);
    if (hit.d <= 0) { el.querySelector(".what").textContent = label + " now!"; el.querySelector(".clock").textContent = hm12(fmt(hit.at, { hour: "2-digit", minute: "2-digit", hourCycle: "h23" })); return; }
    var sec = Math.ceil(hit.d / 1000);
    el.querySelector(".what").textContent = label + " in";
    el.querySelector(".clock").textContent = Math.floor(sec / 60) + ":" + ("0" + sec % 60).slice(-2);
  }
  function findBrief(id) { return (data.briefings || []).filter(function (b) { return b.id === id; })[0]; }
  function toggleCheck(id, key) {
    var b = findBrief(id); if (!b) return;
    var done = checks(b), i = done.indexOf(key);
    if (i >= 0) done.splice(i, 1); else done.push(key);
    try { localStorage.setItem("slv-brief-check-" + id, JSON.stringify(done)); } catch (e) {}
    var y = window.scrollY; renderBriefings(); window.scrollTo(0, y);
  }
  function openPass(id, push) {
    var b = findBrief(id); if (!b || !b.pass) return;
    $(".pass-view img").src = asset(b.pass.image);
    $(".pass-view .pass-print").setAttribute("data-b", id);
    var pdf = $(".pass-view .pass-pdf");
    if (b.pass.pdf) { pdf.href = asset(b.pass.pdf); pdf.style.display = ""; } else pdf.style.display = "none";
    // While the pass is on screen, printing (our Print button, or Share > Print) prints only the pass.
    // iPhone/iPad build the print preview after a delay, so this stays on until the pass is closed.
    $("#print-pass img").src = asset(b.pass.image);
    document.documentElement.classList.add("printing-pass");
    $(".pass-view").classList.add("open");
    if (push) history.pushState({ v: "pass", id: id }, "", location.hash);
  }
  function closePass() {
    $(".pass-view").classList.remove("open");
    document.documentElement.classList.remove("printing-pass");
  }
  function printPass(id) {
    var b = findBrief(id); if (!b || !b.pass) return;
    if (!$(".pass-view").classList.contains("open")) openPass(id, true);   // show the pass, then print it
    var img = $("#print-pass img");
    if (img.complete && img.naturalWidth) return window.print();
    img.onload = function () { img.onload = null; window.print(); };
  }

  // ---- "Add to home screen" helper: open the guide with ?install (e.g. /fieldguide/?install) ----
  var installEvt = null;
  window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); installEvt = e; if ($(".install-sheet").classList.contains("open")) renderInstall(); });
  window.addEventListener("appinstalled", function () { installEvt = null; renderInstall("done"); });
  var ua = navigator.userAgent;
  var isStandalone = (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
  var isIOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/.test(ua);
  var inAppBrowser = /FBAN|FBAV|FB_IAB|FBIOS|Messenger|Instagram|Line\/|LinkedInApp|GSA\//.test(ua);
  var ICO_SHARE = '<span class="ico"><svg viewBox="0 0 24 24"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M6 11v9h12v-9"/></svg></span>';
  var ICO_PLUS = '<span class="ico"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M12 8v8M8 12h8"/></svg></span>';
  var ICO_MORE = '<span class="ico"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></span>';
  var ICO_DOTS = '<span class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg></span>';
  function renderInstall(state) {
    var opening = inAppBrowser && escapeMode && !wantInstall && !isStandalone && state !== "done";
    var url = location.origin + "/fieldguide/?install", html = '<div class="hero"><img src="/fieldguide-icon-180.png" alt=""><div><b>' +
      (opening ? "Open RR Field Guide in " + (isIOS ? "Safari" : "Chrome") : "Add RR Field Guide to your home screen") + "</b>" +
      "<span>" + (opening ? "It works best in your phone&rsquo;s browser." : "One tap to open it at events, even on weak Wi-Fi.") + "</span></div></div>";
    if (state === "done" || isStandalone) {
      html += "<p>All set! Open <b>RR Field Guide</b> from your home screen any time.</p>";
    } else if (inAppBrowser && escapeMode && escapeUrl()) {
      // ?open: offer a one-tap jump out of Messenger/Facebook/Instagram into Safari or Chrome.
      var app = isIOS ? "Safari" : "Chrome";
      html += "<p>You&rsquo;re in another app&rsquo;s browser. Open the guide in <b>" + app + "</b> for the best experience" +
        (wantInstall ? " and to add it to your home screen" : "") + ".</p>" +
        '<button type="button" class="big install-escape">Open in ' + app + "</button>" +
        '<p class="tip">Nothing happened? Tap the ' + (isIOS ? ICO_MORE + " or " + ICO_SHARE : ICO_DOTS) + " button in this app&rsquo;s browser and choose <b>Open in " + app +
        "</b> (or <b>Open in browser</b>).</p>" + '<button type="button" class="alt install-copy">Copy link instead</button>' +
        (wantInstall ? "" : '<p class="tip"><button type="button" class="alt install-close" style="margin-top:4px">Keep using it here</button></p>');
    } else if (inAppBrowser) {
      html += "<p>This link opened inside another app, which can&rsquo;t add home screen icons. Open it in your phone&rsquo;s browser first:</p><ol>" +
        (isIOS ? "<li>Tap the " + ICO_MORE + " or " + ICO_SHARE + " button in this app&rsquo;s browser.</li><li>Choose <b>Open in Safari</b> (or <b>Open in browser</b>).</li>"
               : "<li>Tap the " + ICO_DOTS + " menu in this app&rsquo;s browser.</li><li>Choose <b>Open in Chrome</b> (or <b>Open in browser</b>).</li>") +
        "</ol><button type=\"button\" class=\"alt install-copy\">Copy link instead</button><p class=\"tip\">Then come back here and follow the steps.</p>";
    } else if (isIOS) {
      html += "<ol><li>Tap the <b>Share</b> button " + ICO_SHARE + " (on newer iPhones it&rsquo;s under the " + ICO_MORE + " button).</li>" +
        "<li>Scroll down and tap <b>Add to Home Screen</b> " + ICO_PLUS + ".</li><li>Tap <b>Add</b>.</li></ol>" +
        '<p class="tip">Using Chrome on iPhone? Same steps: Share, then Add to Home Screen.</p>';
    } else if (installEvt) {
      html += '<button type="button" class="big install-go">Add to Home screen</button><p class="tip">Your phone will ask you to confirm.</p>';
    } else if (isAndroid) {
      html += "<ol><li>Tap the <b>menu</b> " + ICO_DOTS + " at the top right of your browser.</li><li>Tap <b>Add to Home screen</b> or <b>Install app</b>.</li><li>Tap <b>Add</b> / <b>Install</b>.</li></ol>";
    } else {
      html += "<p>Open this link on your phone to add it to your home screen:</p><p><b>" + esc(url.replace(/^https?:\/\//, "")) + "</b></p>";
    }
    $(".install-sheet .body").innerHTML = html;
  }
  // ?open (only when the link includes it): jump from an in-app browser to Safari/Chrome, keeping ?install if present.
  var wantInstall = /[?&]install\b/.test(location.search), escapeMode = false;
  var escapeTarget = location.origin + location.pathname + (wantInstall ? "?install" : "") + location.hash;
  function escapeUrl() {
    if (isIOS) return "x-safari-" + escapeTarget;   // unofficial, but widely supported on recent iOS
    if (isAndroid) return "intent://" + escapeTarget.replace(/^https?:\/\//, "") + "#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=" +
      encodeURIComponent(escapeTarget) + ";end";
    return "";
  }
  function tryEscape() { var u = escapeUrl(); if (u) location.href = u; }
  function openInstall() { renderInstall(); $(".install-sheet").classList.add("open"); }
  function closeInstall() { $(".install-sheet").classList.remove("open"); }

  // ---- QR codes tab ----
  function renderLinks() {
    $(".links").innerHTML = LINKS.map(function (l) {
      var icon = l.style === "fb" ? ICON_FB : l.style === "ig" ? ICON_IG : "";
      return '<button type="button" class="lnk ' + (l.style || "") + '" data-key="' + l.key + '"' + (l.url ? "" : " disabled") + ">" + icon +
        "<span>" + esc(l.label) + (l.url ? "" : "<small>Link needed</small>") + "</span></button>";
    }).join("");
  }

  // ---- navigation (phone back button/gesture closes the QR, then the animal) ----
  function showTab(name) {
    document.querySelectorAll(".tabbar button").forEach(function (b) { b.setAttribute("aria-selected", String(b.getAttribute("data-tab") === name)); });
    document.querySelectorAll(".tab").forEach(function (t) { t.classList.toggle("on", t.id === "tab-" + name); });
    window.scrollTo(0, 0);
    if (name === "brief") {
      var b0 = activeBriefings()[0];
      if (b0 && !seenBrief(b0)) { try { localStorage.setItem("slv-brief-seen-" + b0.id, "1"); } catch (e) {} renderBriefings(); }
    }
  }
  window.addEventListener("popstate", function (e) {
    var s = e.state || {};
    if (s.v !== "pass") closePass();
    if (s.v !== "info") closeInfo();
    if (s.v !== "qr") closeQr();
    if (s.v === "animal") openAnimal(s.id, false); else if (s.v !== "qr") closeAnimal();
  });
  function back() { if (history.state && history.state.v) history.back(); else { closeInfo(); closePass(); closeQr(); closeAnimal(); } }

  document.addEventListener("click", function (e) {
    var t = e.target;
    var c = t.closest(".card"); if (c) return openAnimal(c.getAttribute("data-id"), true);
    var tab = t.closest(".tabbar button"); if (tab) { tabPicked = true; return showTab(tab.getAttribute("data-tab")); }
    var today = t.closest(".today-card");
    if (today) return today.getAttribute("data-brief") ? showTab("brief") : openEvent(today.getAttribute("data-ev"));
    if (t.closest(".install-escape")) return tryEscape();
    if (t.closest(".install-close") || (t.classList && t.classList.contains("install-sheet"))) return closeInstall();
    if (t.closest(".install-go") && installEvt) {
      installEvt.prompt();
      installEvt.userChoice.then(function (c) { if (c.outcome === "accepted") renderInstall("done"); }).catch(function () {});
      installEvt = null; return;
    }
    if (t.closest(".install-copy")) {
      var lnk2 = escapeMode ? escapeTarget : location.origin + "/fieldguide/?install";
      try { navigator.clipboard.writeText(lnk2).then(function () { t.textContent = "Link copied! Paste it in your browser"; }); } catch (e2) { prompt("Copy this link:", lnk2); }
      return;
    }
    var ql = t.closest(".bf-qr-link");
    if (ql) { var lq = LINKS.filter(function (x) { return x.key === ql.getAttribute("data-qr"); })[0]; return lq && lq.url && openQr(lq.qrLabel, lq.url, true); }
    if (t.closest(".bf-alert button")) { tabPicked = true; return showTab("brief"); }
    var il = t.closest(".bf-info-link"); if (il) return openInfo(il.getAttribute("data-info"), true);
    if (t.classList && t.classList.contains("info-sheet")) return back();   // tap outside the panel
    var bc = t.closest(".bf-check"); if (bc) return toggleCheck(bc.getAttribute("data-b"), bc.getAttribute("data-k"));
    var po = t.closest(".bf-pass-open"); if (po) return openPass(po.getAttribute("data-b"), true);
    var pp = t.closest(".bf-pass-print, .pass-print"); if (pp) return printPass(pp.getAttribute("data-b"));
    var chip = t.closest(".chips button");
    if (chip) {
      filterType = chip.getAttribute("data-type");
      document.querySelectorAll(".chips button").forEach(function (b) { b.setAttribute("aria-pressed", String(b === chip)); });
      return renderAnimals();
    }
    var lnk = t.closest(".lnk");
    if (lnk && !lnk.disabled) {
      var l = LINKS.filter(function (x) { return x.key === lnk.getAttribute("data-key"); })[0];
      return openQr(l.qrLabel, l.url, true);
    }
    if (t.closest(".qr-view .close") || t.closest(".sheet-close") || t.closest(".pass-view .close") || t.closest(".info-sheet .close")) return back();
  });
  $(".search").addEventListener("input", function (e) { query = e.target.value.trim().toLowerCase(); renderAnimals(); });

  renderLinks();
  var wantOpen = /[?&]open\b/.test(location.search);
  if (wantInstall || wantOpen) history.replaceState(null, "", location.pathname + location.hash);   // keep ?install / ?open out of the saved address
  if (wantOpen && inAppBrowser) { escapeMode = true; openInstall(); tryEscape(); }
  else if (wantInstall) openInstall();
  load().then(function () {
    var m = location.hash.match(/^#animal-(.+)$/);
    if (m) { history.replaceState(null, "", location.pathname); showTab("animals"); openAnimal(decodeURIComponent(m[1]), true); }
  });
  setInterval(function () { if (!document.hidden) load(); }, REFRESH_MS);
  setInterval(function () { if (!document.hidden) renderEvents(); }, 60000);
  setInterval(function () { if (!document.hidden) updateAlert(); }, 1000);   // milestone countdown bar   // "Today" / "Happening now" stay current
  document.addEventListener("visibilitychange", function () { if (!document.hidden) showUpdated(false); });
})();
</script>
</body>
</html>
