<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#faf7f2">
<title>Redemption Rescue</title>
<!--
  Hand-off page for the volunteer field guide. When the guide runs from the home screen, iPhone opens outside links
  (Messenger, Maps) in a mini-browser; if the link jumps to another app, that mini-browser is left blank. Opening
  this page first means the person comes back to clear instructions instead of a blank screen.
  Usage: /go.html?to=<encoded url>&label=<button text>   (only the hosts in ALLOWED are accepted)
-->
<style>
  html, body { margin: 0; min-height: 100%; background: #faf7f2; color: #2a2622; font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif; }
  main { max-width: 420px; margin: 0 auto; padding: calc(70px + env(safe-area-inset-top, 0px)) 22px 40px; text-align: center; }
  img { width: 76px; height: 76px; border-radius: 16px; box-shadow: 0 2px 10px rgba(0,0,0,.12); }
  h1 { margin: 18px 0 8px; font-size: 22px; }
  p { margin: 0 0 18px; font-size: 16px; line-height: 1.5; color: #4a443e; }
  a.btn { display: flex; align-items: center; justify-content: center; min-height: 56px; border-radius: 14px; background: rgb(221, 115, 8); color: #fff;
    font-size: 18px; font-weight: 700; text-decoration: none; }
  a.btn.chat { background: linear-gradient(90deg, #0a7cff, #a033ff); }
  .back { margin-top: 26px; padding: 14px 16px; border-radius: 14px; background: #fff; box-shadow: 0 1px 2px rgba(60,40,20,.06), 0 4px 14px rgba(60,40,20,.06); font-size: 16px; line-height: 1.45; }
  .back b { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 50%; border: 1px solid #ddd; background: #fff; font-size: 16px; vertical-align: middle; }
  .err { color: #a33; }
  a.alt { display: flex; align-items: center; justify-content: center; min-height: 48px; margin-top: 14px; border-radius: 12px; border: 1.5px solid rgb(221, 115, 8);
    color: #a85500; font-size: 16px; font-weight: 600; text-decoration: none; }
</style>
</head>
<body>
<main>
  <img src="/fieldguide-icon-180.png" alt="">
  <h1 id="title">Opening&hellip;</h1>
  <p id="text"></p>
  <a class="btn" id="go" href="#"></a>
  <div class="back">Done? Tap <b>&times;</b> at the top left to get back to the <strong>RR Field Guide</strong>.</div>
  <a class="alt" id="back" href="/fieldguide/">Back to the guide</a>
</main>
<script>
(function () {
  document.getElementById("back").addEventListener("click", function (e) { if (history.length > 1) { e.preventDefault(); history.back(); } });
  var ALLOWED = ["m.me", "www.messenger.com", "www.facebook.com", "facebook.com", "www.instagram.com", "instagram.com", "maps.apple.com", "www.google.com"];
  var q = {};
  location.search.replace(/[?&]([^=&]+)=?([^&]*)/g, function (_, k, v) { q[k] = decodeURIComponent(v.replace(/\+/g, " ")); });
  var a = document.createElement("a"); a.href = q.to || "";
  var ok = /^https:$/.test(a.protocol) && ALLOWED.indexOf(a.hostname) >= 0 && (a.hostname !== "www.google.com" || a.pathname.indexOf("/maps") === 0);
  var go = document.getElementById("go"), title = document.getElementById("title"), text = document.getElementById("text");
  if (!ok) { title.textContent = "This link isn’t available"; text.className = "err"; text.textContent = "Please go back to the guide."; go.style.display = "none"; return; }
  var isChat = /m\.me|messenger|facebook/.test(a.hostname), isMap = /maps/.test(a.hostname + a.pathname);
  var label = q.label || (isChat ? "Open group chat" : isMap ? "Open in Maps" : "Open link");
  go.href = a.href;
  go.textContent = label;
  if (isChat) go.className = "btn chat";
  title.textContent = isChat ? "Event group chat" : isMap ? "Directions" : label;
  text.textContent = isChat ? "Tap below to open the group chat in Messenger." : isMap ? "Tap below to open directions in your maps app." : "Tap below to continue.";
})();
</script>
</body>
</html>
